<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welgemoed Pre-Primary School — Grade R Curriculum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: oklch(0.97 0.018 85); font-family: 'Nunito', sans-serif; color: oklch(0.28 0.02 80); }
  h1, h2, h3 { font-family: 'Fredoka', sans-serif; margin: 0; }
  button { font-family: inherit; }

  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* Sticky top bar: term tabs + language toggle */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: oklch(0.99 0.012 85 / 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid oklch(0.90 0.03 85);
  }
  .topbar-inner {
    max-width: 1120px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: oklch(0.32 0.03 80); white-space: nowrap; }
  .brand-emoji { font-size: 22px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab-btn {
    font-weight: 600; padding: 8px 16px; border-radius: 999px; border: none;
    background: oklch(0.94 0.02 85); cursor: pointer; font-size: 14px; color: oklch(0.42 0.02 80);
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .tab-btn:hover { transform: translateY(-1px); background: oklch(0.90 0.03 85); }
  .tab-btn.active { background: oklch(0.42 0.12 30); color: oklch(1 0 0); box-shadow: 0 6px 14px -6px oklch(0.42 0.12 30 / 0.6); }
  .lang-toggle { display: flex; background: oklch(0.94 0.02 85); border-radius: 999px; padding: 3px; gap: 2px; }
  .lang-btn { padding: 7px 14px; border-radius: 999px; border: none; background: transparent; font-weight: 800; font-size: 12.5px; letter-spacing: 0.4px; cursor: pointer; color: oklch(0.5 0.02 80); }
  .lang-btn.active { background: oklch(0.3 0.03 80); color: oklch(1 0 0); }

  .page { max-width: 1120px; margin: 0 auto; padding: 36px 24px 72px; }

  /* Hero */
  .hero {
    position: relative; background: oklch(0.99 0.012 85); border: 3px solid oklch(0.90 0.03 85);
    border-radius: 34px; padding: 40px 44px; box-shadow: 0 18px 40px -24px oklch(0.5 0.05 80 / 0.4); overflow: hidden;
  }
  .hero-emojis { display: flex; gap: 12px; font-size: 28px; position: absolute; top: 22px; right: 30px; opacity: 0.9; }
  .hero-emojis span:nth-child(1) { animation: floaty 4s ease-in-out infinite; }
  .hero-emojis span:nth-child(2) { animation: floaty 4s ease-in-out infinite 0.6s; }
  .hero-emojis span:nth-child(3) { animation: floaty 4s ease-in-out infinite 1.2s; }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px; background: oklch(0.94 0.05 145); color: oklch(0.42 0.12 145);
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; padding: 7px 16px;
    border-radius: 999px; text-transform: uppercase;
  }
  .hero h1 { font-weight: 700; font-size: 44px; line-height: 1.08; margin: 16px 0 10px; color: oklch(0.30 0.03 80); max-width: 720px; text-wrap: balance; }
  .hero-sub { font-size: 18px; line-height: 1.5; margin: 0; max-width: 640px; font-weight: 600; color: oklch(0.42 0.02 80); }
  .stat-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .stat-pill { display: flex; align-items: center; gap: 10px; border-radius: 16px; padding: 11px 18px; }
  .stat-icon { font-size: 22px; }
  .stat-label { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 15px; }

  /* Area sections */
  .area-section { margin-top: 44px; }
  .area-head {
    display: flex; align-items: center; gap: 14px; border-radius: 22px; padding: 16px 24px;
    box-shadow: 0 12px 26px -18px oklch(0.3 0.1 80 / 0.5);
  }
  .area-emoji { font-size: 32px; background: oklch(1 0 0 / 0.22); width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none; }
  .area-head h2 { font-weight: 700; font-size: 25px; color: oklch(1 0 0); }

  .group-card { background: oklch(0.99 0.012 85); border: 2px solid oklch(0.91 0.03 85); border-radius: 22px; padding: 20px 22px; margin-top: 16px; }
  .group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .group-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .group-head h3 { font-weight: 600; font-size: 18px; color: oklch(0.32 0.03 80); }

  .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .skill-card {
    display: flex; align-items: center; gap: 12px; border: 2px solid transparent; border-radius: 15px;
    padding: 11px 13px; text-align: left; cursor: pointer; width: 100%;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .skill-card:hover { transform: translateY(-2px); box-shadow: 0 10px 18px -12px oklch(0.4 0.1 80 / 0.5); }
  .skill-icon { flex: none; width: 40px; height: 40px; border-radius: 50%; background: oklch(1 0 0); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px -6px oklch(0.4 0.05 80 / 0.5); }
  .skill-text { flex: 1; font-weight: 700; font-size: 14px; line-height: 1.3; color: oklch(0.3 0.02 80); }
  .skill-chevron { flex: none; font-size: 17px; font-weight: 800; }

  .page-footer { text-align: center; margin-top: 46px; font-weight: 700; font-size: 15px; color: oklch(0.55 0.02 80); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; background: oklch(0.25 0.03 80 / 0.55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 24px; animation: overlayIn 0.2s ease both;
  }
  .modal-card {
    position: relative; width: 100%; max-width: 460px; max-height: calc(100vh - 48px); overflow-y: auto;
    background: oklch(0.99 0.012 85); border-radius: 28px; box-shadow: 0 30px 70px -30px oklch(0.2 0.05 80 / 0.7);
    animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; border: none;
    background: oklch(0.2 0.03 80 / 0.4); color: oklch(1 0 0); font-size: 19px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-header { position: relative; padding: 30px 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .modal-icon { font-size: 40px; background: oklch(1 0 0 / 0.9); width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px -10px oklch(0.2 0.1 80 / 0.5); }
  .modal-crumb {
    background: oklch(1 0 0 / 0.24); color: oklch(1 0 0); font-weight: 800;
    font-size: 11.5px; letter-spacing: 0.5px; text-transform: uppercase; padding: 5px 14px; border-radius: 999px; text-align: center;
  }
  .modal-body { padding: 26px 28px 30px; }
  .modal-title { font-size: 19px; line-height: 1.4; font-weight: 700; color: oklch(0.3 0.03 80); text-wrap: pretty; margin: 0 0 12px; }
  .modal-desc { margin: 0; font-size: 15.5px; line-height: 1.6; font-weight: 600; color: oklch(0.42 0.02 80); text-wrap: pretty; }

  @media (max-width: 640px) {
    .hero h1 { font-size: 32px; }
    .hero { padding: 30px 24px; }
    .topbar-inner { justify-content: center; }
    .tabs { order: 3; width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="curriculum-data.js"></script>
<script src="app.js"></script>
</body>
</html>
